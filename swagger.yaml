openapi: 3.0.0
info:
  title: Smart Wedding Backend API
  version: 1.0.0
  description: API documentation for the Smart Wedding Backend
servers:
  - url: http://localhost:5000
paths:
  /api/users/signup:
    post:
      summary: User signup
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                email:
                  type: string
                  format: email
                mobile:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
              required:
                - name
                - address
                - email
                - mobile
                - username
                - password
      responses:
        '201':
          description: User created
        '400':
          description: Bad request
        '409':
          description: Username or email already exists

  /api/users/login:
    post:
      summary: User login
      description: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
              required:
                - username
                - password
      responses:
        '200':
          description: Login successful
        '400':
          description: Bad request
        '401':
          description: Invalid username or password

  /api/weddings:
    post:
      summary: Create a new wedding
      description: Requires authentication. The username must exist in the Users table.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username of the wedding owner (must exist in Users table)
                event_date:
                  type: string
                  format: date
              required:
                - username
                - event_date
      responses:
        '201':
          description: Wedding created
        '400':
          description: Bad request
        '404':
          description: User not found

  /api/weddings/{slug}:
    get:
      summary: Get wedding by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Wedding found
        '404':
          description: Not found

  /api/guests/bulk:
    post:
      summary: Add multiple guests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wedding_id:
                  type: integer
                guests:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
              required:
                - wedding_id
                - guests
      responses:
        '201':
          description: Guests added
        '400':
          description: Bad request

  /api/guests/{token}:
    get:
      summary: Get guest by token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Guest found
        '404':
          description: Not found

  /api/rsvp:
    post:
      summary: Submit RSVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                attending:
                  type: boolean
                guest_count:
                  type: integer
                message:
                  type: string
              required:
                - token
                - attending
      responses:
        '201':
          description: RSVP submitted
        '400':
          description: Bad request

  /api/rsvp/{wedding_id}:
    get:
      summary: Get RSVPs for a wedding
      parameters:
        - in: path
          name: wedding_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of RSVPs
        '404':
          description: Not found